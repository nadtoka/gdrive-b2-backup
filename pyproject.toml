[project]
name = "gdrive-b2-backup"
version = "0.1.0"
description = "Self-hosted Google Drive to Backblaze B2 (S3) backup microservice with Web UI, snapshot archiving, and Prometheus metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "apscheduler==3.11.0",
    "httpx==0.28.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
